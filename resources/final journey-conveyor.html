<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One System. Every Stage of the Customer Journey.</title>
<style>
  :root{
    --blue: #2f5cf0;
    --blue-dark: #1f3fb8;
    --ink: #0f172a;
    --muted: #6b7686;
    --bg: #ffffff;
    --steel: #aab4c6;
    --steel-dark: #8b96ab;
    --duration: 34s;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 56px 0 64px;
  }

  h1{
    text-align:center;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 24px 40px;
  }

  .stage-wrap{
    position: relative;
    max-width: 1180px;
    margin: 0 auto;
  }

  .fade{
    position:absolute;
    top:0; bottom:0;
    width: 70px;
    z-index: 5;
    pointer-events:none;
  }
  .fade.left{ left:0; background:linear-gradient(90deg, var(--bg), transparent); }
  .fade.right{ right:0; background:linear-gradient(270deg, var(--bg), transparent); }

  .scroller{
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #d3d9e6 transparent;
    padding: 8px 40px 14px;
  }
  .scroller::-webkit-scrollbar{ height: 6px; }
  .scroller::-webkit-scrollbar-thumb{ background:#d3d9e6; border-radius: 10px; }
  .scroller::-webkit-scrollbar-track{ background: transparent; }

  /* track holds icons AND the belt/cogs beneath them, all in one
     coordinate space, so a manual drag moves everything together
     and the auto-scroll animation moves everything together too */
  .track{
    position: relative;
    display: flex;
    align-items: flex-start;
    width: max-content;
    will-change: transform;
    padding-top: 4px;
    min-height: 232px;
  }

  .track.auto{ animation: drift var(--duration) linear infinite; }
  .scroller.paused .track.auto{ animation-play-state: paused; }
  .scroller.paused .roller{ animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce){
    .track.auto{ animation: none; }
    .roller{ animation: none !important; }
  }

  @keyframes drift{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .stage{ display:flex; align-items:flex-start; flex: 0 0 auto; position: relative; z-index: 3; }

  .node{
    display:flex; flex-direction:column; align-items:center;
    justify-content: flex-start;
    width: 142px; height: 168px; text-align:center;
    margin: 0 5px;
    padding: 18px 10px 16px;
    position: relative;
    box-sizing: border-box;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255,255,255,0.62), rgba(255,255,255,0.32));
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow:
      0 10px 24px -10px rgba(15,35,90,0.3),
      inset 0 1px 0 rgba(255,255,255,0.85),
      inset 0 -1px 0 rgba(255,255,255,0.2);
    overflow: hidden;
  }

  /* diagonal glass sheen */
  .node::before{
    content: "";
    position: absolute;
    top: -60%; left: -20%;
    width: 60%; height: 220%;
    background: linear-gradient(120deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 60%);
    transform: rotate(20deg);
    pointer-events: none;
  }

  .icon{
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(155deg, var(--blue), var(--blue-dark));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 18px -6px rgba(47,92,240,0.45);
    flex-shrink:0;
    position: relative; z-index: 1;
  }
  .icon svg{ width: 27px; height: 27px; stroke: #fff; fill:none; stroke-width:1.8; }
  .node.first .icon{ box-shadow: 0 0 0 6px rgba(47,92,240,0.16), 0 8px 18px -6px rgba(47,92,240,0.45); }

  .label{ margin-top: 13px; font-size: 13px; font-weight: 800; letter-spacing: 0.03em; color: var(--ink); position: relative; z-index: 1; }
  .desc{ margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.35; max-width: 118px; height: 32px; overflow: hidden; position: relative; z-index: 1; }

  .arrow{
    flex: 0 0 auto; width: 30px; height: 60px;
    display:flex; align-items:center; justify-content:center; color: #b7c0d6;
    margin-top: 18px;
    position: relative; z-index: 3;
  }
  .arrow svg{ width: 24px; height: 24px; }

  /* ---------- conveyor belt (absolutely positioned under the icon row,
     lives inside .track so it always shares the track's transform) ----------
     Glowing blue belt: navy pill, bright blue border with outer + inner
     glow, a grey centerline, and CSS-drawn rollers with a visible
     spinning cross so the motion reads clearly. */
  .belt-wrap{
    position: absolute;
    left: 0; right: 0;
    top: 184px;
    height: 44px;
    z-index: 1;
  }

  .belt-band{
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 44px;
    border-radius: 30px;
    background: #1e3a8a;
    border: 4px solid #3b82f6;
    box-shadow:
      0 0 20px #3b82f6,
      inset 0 0 15px #3b82f6,
      inset 0 -8px 0 rgba(0,0,0,0.3);
    z-index: 1;
  }

  .belt-line{
    position: absolute;
    left: 18px; right: 18px;
    top: 50%;
    height: 4px;
    margin-top: -2px;
    background: #cbd5e1;
    border-radius: 2px;
    z-index: 1;
  }

  .roller{
    position:absolute;
    top: 4px;
    width: 36px; height: 36px;
    background: #e2e8f0;
    border: 4px solid #64748b;
    border-radius: 50%;
    animation: spin 2.4s linear infinite;
    transform-origin: 50% 50%;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .roller::before{
    content: "";
    position: absolute;
    width: 100%; height: 5px;
    background: #94a3b8;
  }
  .roller::after{
    content: "";
    position: absolute;
    width: 5px; height: 100%;
    background: #94a3b8;
  }
  .roller-inner{
    width: 12px; height: 12px;
    background: #f1f5f9;
    border-radius: 50%;
    position: relative;
    z-index: 3;
  }
  @keyframes spin{ from{ transform: rotate(0deg); } to{ transform: rotate(-360deg); } }

  .caption-row{ display:flex; justify-content:center; margin-top: 26px; padding: 0 24px; }
  .caption{ display:flex; align-items:center; gap: 10px; font-size: 13px; color: var(--muted); }
  .caption::before, .caption::after{ content:""; width: 34px; height: 1px; background: #d8deea; }
  .caption b{ color: var(--ink); font-weight: 700; }

  .hint{ text-align:center; font-size: 11.5px; color: #a4adbd; margin-top: 10px; }
</style>
</head>
<body>

<h1>One System. Every Stage of the Customer Journey.</h1>

<div class="stage-wrap">
  <div class="fade left"></div>
  <div class="fade right"></div>

  <div class="scroller" id="scroller">
    <div class="track auto" id="track"></div>
  </div>
</div>

<div class="caption-row">
  <div class="caption">We don't just send emails. <b>We build systems that grow your business.</b></div>
</div>
<div class="hint">Scroll to explore &middot; drag anytime to pause</div>

<script>
  const stages = [
    { label: "ATTRACT", desc: "New Lead", first: true, icon: `<path d="M12 2 L12 6" stroke-linecap="round"/><path d="M12 18 L12 22" stroke-linecap="round"/><path d="M2 12 L6 12" stroke-linecap="round"/><path d="M18 12 L22 12" stroke-linecap="round"/><circle cx="12" cy="12" r="4"/>` },
    { label: "NURTURE", desc: "Follow-Up (Email / SMS)", icon: `<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 7l8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/>` },
    { label: "CONVERT", desc: "Booking / Appointment", icon: `<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16" stroke-linecap="round"/><path d="M8 3v4M16 3v4" stroke-linecap="round"/><path d="M9 14l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>` },
    { label: "SERVE", desc: "Deliver Great Service", icon: `<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>` },
    { label: "DELIGHT", desc: "Review & Referral", icon: `<path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8L12 4z" stroke-linejoin="round"/>` },
    { label: "RETAIN", desc: "Re-Engage & Upsell", icon: `<path d="M4 12a8 8 0 0 1 13.7-5.7L20 8" stroke-linecap="round"/><path d="M20 4v4h-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16" stroke-linecap="round"/><path d="M4 20v-4h4" stroke-linecap="round" stroke-linejoin="round"/>` },
    { label: "GROW", desc: "Repeat Customer More Revenue", icon: `<path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" stroke-linecap="round" stroke-linejoin="round"/>` },
  ];

  const arrowSVG = `<svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function buildStageGroup(){
    let html = "";
    stages.forEach((s, i) => {
      html += `
        <div class="node${s.first ? " first" : ""}">
          <div class="icon"><svg viewBox="0 0 24 24">${s.icon}</svg></div>
          <div class="label">${s.label}</div>
          <div class="desc">${s.desc}</div>
        </div>`;
      if (i < stages.length - 1){
        html += `<div class="arrow">${arrowSVG}</div>`;
      }
    });
    return `<div class="stage">${html}</div>`;
  }

  const track = document.getElementById("track");

  const rowsHtml = buildStageGroup() + buildStageGroup();

  const nodeWidth = 152, arrowWidth = 30;
  const stageUnit = nodeWidth + arrowWidth;
  const groupWidth = stageUnit * stages.length - arrowWidth;
  const totalWidth = groupWidth * 2;

  // rollers strung evenly along the whole belt, independent of icon
  // spacing, like the reference conveyor illustration
  const rollerSpacing = 78;
  const rollerCount = Math.round(totalWidth / rollerSpacing);
  let rollerHtml = "";
  for (let i = 0; i <= rollerCount; i++){
    const x = 20 + i * rollerSpacing;
    if (x > totalWidth - 20) break;
    rollerHtml += `<div class="roller" style="left:${x}px"><div class="roller-inner"></div></div>`;
  }

  track.innerHTML = `
    ${rowsHtml}
    <div class="belt-wrap" style="width:${totalWidth}px">
      <div class="belt-band"></div>
      <div class="belt-line"></div>
      ${rollerHtml}
    </div>
  `;

  const scroller = document.getElementById("scroller");
  let resumeTimer = null;

  function pauseAuto(){
    scroller.classList.add("paused");
    clearTimeout(resumeTimer);
  }
  function scheduleResume(){
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => scroller.classList.remove("paused"), 2500);
  }

  ["pointerdown","wheel","touchstart"].forEach(evt=>{
    scroller.addEventListener(evt, pauseAuto, { passive:true });
  });
  ["pointerup","touchend","mouseleave"].forEach(evt=>{
    scroller.addEventListener(evt, scheduleResume, { passive:true });
  });
  scroller.addEventListener("mouseenter", pauseAuto);

  scroller.addEventListener("scroll", () => {
    const half = track.scrollWidth / 2;
    if (scroller.scrollLeft >= half){
      scroller.scrollLeft -= half;
    } else if (scroller.scrollLeft <= 0 && scroller.scrollLeft !== 0){
      scroller.scrollLeft += half;
    }
  }, { passive:true });
</script>

</body>
</html>
